services:
  mc:
    image: itzg/minecraft-server:latest
    container_name: minecraft
    ports:
      - 25565:25565
    environment:
      EULA: "TRUE"
      USE_AIKAR_FLAGS: "TRUE"
    tty: true
    stdin_open: true
    restart: no
    network_mode: bridge
    volumes:
      - /data/portainer/mc:/data

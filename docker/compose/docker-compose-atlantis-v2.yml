services:
  grafana:
    user: "0" # Needs to be root to create directories
    image: grafana/grafana:13.1.3 # Current (2026-0808)
    container_name: grafana
    restart: unless-stopped
    network_mode: host
    environment:
      GF_SERVER_PROTOCOL: "https" # Ensure runtime protocol matches grafana.ini
      GF_SERVER_HTTP_ADDR: "0.0.0.0" # Binds to all addresses
      GF_SERVER_HTTP_PORT: "3443"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - "/data/desertratz/grafana:/var/lib/grafana" # Grafana directory
      - "/data/desertratz/cfg/grafana.ini:/etc/grafana/grafana.ini:ro" # Grafana cfg file
      - "/data/desertratz/cfg/certs:/etc/grafana/certs:ro" # Grafana certs directory
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5" # Increased from 0.3 to allow Grafana more CPU headroom
          memory: 1024M
        reservations:
          cpus: "0.15"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 5 127.0.0.1 3443 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  prometheus:
    user: "0" # Needs to be root to create directories
    image: prom/prometheus:v3.13.2 # Current (2026-08-08)
    container_name: prometheus
    restart: unless-stopped
    network_mode: host
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--log.level=error"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=10d"
      - "--web.enable-lifecycle"
      - "--web.listen-address=0.0.0.0:9091"
    volumes:
      - type: bind
        source: "/data/desertratz/prometheus"
        target: "/prometheus"
      - type: bind
        source: "/data/desertratz/prometheus/prometheus.yml"
        target: "/etc/prometheus/prometheus.yml"
        read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.75" # Increased from 0.5 to allow Prometheus more CPU headroom
          memory: 2048M # Reduced from 2304M to leave more RAM for the OS
        reservations:
          cpus: "0.3"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9091/-/healthy >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.5
    container_name: cadvisor
    restart: unless-stopped
    network_mode: host
    command:
      - "-logtostderr"
      - "-docker_only"
      - "--port=8080"
    volumes:
      - type: bind
        source: /
        target: /rootfs
        read_only: true
      - type: bind
        source: /var/run
        target: /var/run
        read_only: true
      - type: bind
        source: /sys
        target: /sys
        read_only: true
      - type: bind
        source: /data/docker # Changed /var/lib/docker to /data/docker
        target: /data/docker # Changed /var/lib/docker to /data/docker
        read_only: true
      - type: bind
        source: /dev/disk
        target: /dev/disk
        read_only: true
    devices:
      - /dev/kmsg # Required by cAdvisor to read kernel messages
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SYS_PTRACE # Needed to inspect other processes/containers instead of running "--privileged"
      - DAC_READ_SEARCH # Needed to read arbitrary files under the read-only bind mounts above
    deploy:
      resources:
        limits:
          cpus: "0.15" # Added safeguard to ensure container stays healthy
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL"," wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  pihole-exporter:
    image: ekofr/pihole-exporter:v1.2.0 # (Current 2026-0811)
    container_name: piholeexporter
    restart: unless-stopped
    network_mode: host
    env_file:
      - "/data/desertratz/cfg/pihole.env"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 64M
        reservations:
          cpus: "0.01"
          memory: 16M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  node-exporter:
    image: prom/node-exporter:v1.12.1 # Current (2026-0808)
    container_name: nodeexporter
    restart: unless-stopped
    network_mode: host
    command:
      - "--path.sysfs=/host/sys"
      - "--path.procfs=/host/proc"
      - "--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)"
      - "--no-collector.ipvs"
      - "--web.listen-address=0.0.0.0:9100"
    volumes:
      - type: bind
        source: /
        target: /rootfs
        read_only: true
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
      - type: bind
        source: /sys
        target: /host/sys
        read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true # Node-Exporter's own fs doesn't need to be writable
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 128M
        reservations:
          cpus: "0.02"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  prometheus-data:
    driver_opts:
      type: none
      o: bind
      device: "/data/desertratz/prometheus"
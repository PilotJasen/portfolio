[server]
protocol = https
http_addr = 0.0.0.0
http_port = 3443

# TLS hardening
min_tls_version = TLS1.2
strict_transport_security = true

# Self-signed SSL certs (see docker-compose)
cert_file = /etc/grafana/certs/server.crt
cert_key = /etc/grafana/certs/server.key

# Enable gzip
enable_gzip = true

[database]
type = sqlite3
path = grafana.db

[security]
# IMPORTANT: do NOT store real secrets in grafana.ini in production.
admin_user = ${GRAFANA_ADMIN_USER}
admin_password = ${GRAFANA_ADMIN_PASSWORD}

[users]
# Disallow user sign up
allow_sign_up = false

[live]
max_concurrent_sessions = 100
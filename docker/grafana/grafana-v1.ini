[server]
protocol = https
http_port = 3443
cert_file = /etc/grafana/certs/server.crt
cert_key = /etc/grafana/certs/server.key
enable_gzip = true

[database]
type = sqlite3
sqlite3 = grafana.db

[security]
admin_user = user
admin_password = super-secret-password

[users]
allow_sign_up = false

[performance]
max_concurrent_sessions = 100